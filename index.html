<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .stats {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #todoInput {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    #todoInput:focus {
      border-color: #667eea;
    }

    #addBtn {
      padding: 12px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.3s;
    }

    #addBtn:hover {
      background: #5568d3;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 16px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .filter-btn.active {
      background: #667eea;
      color: #fff;
    }

    .filter-btn:hover {
      background: #e0e0e0;
    }

    .filter-btn.active:hover {
      background: #5568d3;
    }

    #todoList {
      list-style: none;
      margin-bottom: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    #todoList li {
      display: flex;
      align-items: center;
      padding: 12px;
      margin-bottom: 8px;
      background: #f9f9f9;
      border-radius: 8px;
      transition: all 0.3s;
      border-left: 4px solid #667eea;
    }

    #todoList li:hover {
      background: #f0f0f0;
      transform: translateX(2px);
    }

    #todoList li.completed {
      opacity: 0.7;
      border-left-color: #52c41a;
    }

    #todoList li.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      word-break: break-word;
    }

    .delete-btn {
      background: #ff4d4f;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #todoList li:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: #d9363e;
    }

    .clear-completed {
      text-align: center;
    }

    #clearCompletedBtn {
      padding: 10px 20px;
      background: #fff;
      color: #ff4d4f;
      border: 2px solid #ff4d4f;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
    }

    #clearCompletedBtn:hover {
      background: #ff4d4f;
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
      opacity: 0.3;
    }

    .hidden {
      display: none !important;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: #fff;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: translateY(20px);
      transition: transform 0.3s;
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #333;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #f0f0f0;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #ff4d4f;
      color: #fff;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-input:focus {
      border-color: #667eea;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .delete-btn {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-actions" style="justify-content: flex-end; margin-bottom: 16px;">
      <button id="loginBtn" class="btn btn-primary btn-sm" style="display: none;">Masuk</button>
      <button id="logoutBtn" class="btn btn-secondary btn-sm hidden">Keluar</button>
      <span id="userEmail" style="font-size: 14px; color: #666; align-self: center;"></span>
    </div>
    <h1>Todo List</h1>
    <p class="stats" id="stats"></p>

    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Tambah todo baru..." />
      <button id="addBtn">Tambah</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Semua</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="completed">Selesai</button>
    </div>

    <ul id="todoList"></ul>

    <div class="clear-completed">
      <button id="clearCompletedBtn">Hapus Selesai</button>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="formTitle">Masuk</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="tabs" style="display: flex; gap: 8px; margin-bottom: 20px;">
          <button id="loginTab" class="filter-chip active">Masuk</button>
          <button id="signupTab" class="filter-chip">Daftar</button>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="emailInput" class="form-input" placeholder="email@contoh.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="Minimal 6 karakter" />
        </div>
        <div id="authError" style="color: #ff4d4f; font-size: 14px; margin-bottom: 12px; min-height: 20px;"></div>
        <button id="modalSave" class="btn btn-primary" style="width: 100%; justify-content: center;">Masuk</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="./firebase-app.js"></script>
  <script>
    (function () {
      const STORAGE_KEY = "todoList_v1";
      const COLLECTION = "todos";
      const DOC_ID = "main";
      let todos = [];
      let currentFilter = "all";

      const todoInput = document.getElementById("todoInput");
      const addBtn = document.getElementById("addBtn");
      const todoList = document.getElementById("todoList");
      const stats = document.getElementById("stats");
      const clearCompletedBtn = document.getElementById("clearCompletedBtn");
      const filterBtns = document.querySelectorAll(".filter-btn");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const userEmail = document.getElementById("userEmail");
      const loginModal = document.getElementById("loginModal");
      const modalOverlay = document.getElementById("modalOverlay");
      const modalClose = document.getElementById("modalClose");
      const modalCancel = document.getElementById("modalCancel");
      const modalSave = document.getElementById("modalSave");
      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const formTitle = document.getElementById("formTitle");
      const authError = document.getElementById("authError");

      let isLoginMode = true;

      function updateAuthUI(user) {
        if (user) {
          loginBtn.classList.add("hidden");
          logoutBtn.classList.remove("hidden");
          userEmail.textContent = user.email;
          loadFromFirebase();
        } else {
          loginBtn.classList.remove("hidden");
          logoutBtn.classList.add("hidden");
          userEmail.textContent = "";
          todos = [];
          render();
        }
      }

      function openModal() {
        loginModal.classList.add("open");
        authError.textContent = "";
        emailInput.value = "";
        passwordInput.value = "";
      }

      function closeModal() {
        loginModal.classList.remove("open");
      }

      function switchToLogin() {
        isLoginMode = true;
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        formTitle.textContent = "Masuk";
        modalSave.textContent = "Masuk";
        authError.textContent = "";
      }

      function switchToSignup() {
        isLoginMode = false;
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        formTitle.textContent = "Daftar";
        modalSave.textContent = "Daftar";
        authError.textContent = "";
      }

      async function handleAuth() {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          authError.textContent = "Email dan password harus diisi";
          return;
        }

        try {
          if (isLoginMode) {
            await FirebaseApp.login(email, password);
          } else {
            await FirebaseApp.signup(email, password);
          }
          closeModal();
        } catch (err) {
          authError.textContent = err.message || "Terjadi kesalahan";
        }
      }

      async function handleLogout() {
        await FirebaseApp.logout();
      }

      function saveTodos() {
        if (FirebaseApp.currentUser) {
          FirebaseApp.saveData(COLLECTION, DOC_ID, { todos });
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }
      }

      async function loadFromFirebase() {
        if (!FirebaseApp.currentUser) return;
        const data = await FirebaseApp.loadData(COLLECTION, DOC_ID);
        todos = data?.todos || [];
        render();
      }

      function getFilteredTodos() {
        if (currentFilter === "active") {
          return todos.filter((t) => !t.completed);
        }
        if (currentFilter === "completed") {
          return todos.filter((t) => t.completed);
        }
        return todos;
      }

      function render() {
        const filtered = getFilteredTodos();
        todoList.innerHTML = "";

        const activeCount = todos.filter((t) => !t.completed).length;
        const completedCount = todos.filter((t) => t.completed).length;
        stats.textContent = `${activeCount} tugas aktif, ${completedCount} selesai`;

        if (filtered.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p>${currentFilter === "all" ? "Belum ada todo" : currentFilter === "active" ? "Tidak ada todo aktif" : "Tidak ada todo selesai"}</p>
          `;
          todoList.appendChild(empty);
        } else {
          filtered.forEach((todo) => {
            const li = document.createElement("li");
            if (todo.completed) li.classList.add("completed");
            li.innerHTML = `
              <input type="checkbox" class="todo-checkbox" ${todo.completed ? "checked" : ""} />
              <span class="todo-text"></span>
              <button class="delete-btn">Hapus</button>
            `;
            li.querySelector(".todo-text").textContent = todo.text;
            todoList.appendChild(li);
          });
        }

        clearCompletedBtn.style.display = completedCount > 0 ? "inline-block" : "none";
      }

      function addTodo(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        todos.unshift({ id: Date.now(), text: trimmed, completed: false });
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        const todo = todos.find((t) => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          saveTodos();
          render();
        }
      }

      function deleteTodo(id) {
        todos = todos.filter((t) => t.id !== id);
        saveTodos();
        render();
      }

      function clearCompleted() {
        todos = todos.filter((t) => !t.completed);
        saveTodos();
        render();
      }

      addBtn.addEventListener("click", () => {
        addTodo(todoInput.value);
        todoInput.value = "";
        todoInput.focus();
      });

      todoInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          addTodo(todoInput.value);
          todoInput.value = "";
        }
      });

      todoList.addEventListener("click", (e) => {
        const li = e.target.closest("li");
        if (!li) return;
        const checkbox = e.target.closest(".todo-checkbox");
        const deleteBtn = e.target.closest(".delete-btn");

        const filtered = getFilteredTodos();
        const index = Array.from(todoList.children).indexOf(li);
        const todo = filtered[index];
        if (!todo) return;

        if (checkbox) {
          toggleTodo(todo.id);
        } else if (deleteBtn) {
          deleteTodo(todo.id);
        }
      });

      clearCompletedBtn.addEventListener("click", clearCompleted);

      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          render();
        });
      });

      if (loginBtn) {
        loginBtn.addEventListener("click", openModal);
      }
      if (logoutBtn) {
        logoutBtn.addEventListener("click", handleLogout);
      }
      if (modalClose) {
        modalClose.addEventListener("click", closeModal);
      }
      if (modalCancel) {
        modalCancel.addEventListener("click", closeModal);
      }
      if (modalSave) {
        modalSave.addEventListener("click", handleAuth);
      }
      if (loginTab) {
        loginTab.addEventListener("click", switchToLogin);
      }
      if (signupTab) {
        signupTab.addEventListener("click", switchToSignup);
      }
      if (modalOverlay) {
        modalOverlay.addEventListener("click", (e) => {
          if (e.target === modalOverlay) closeModal();
        });
      }
      if (passwordInput) {
        passwordInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") handleAuth();
        });
      }

      FirebaseApp.init(updateAuthUI);
    })();
  </script>
</body>
</html>
